name: Agillion
description: >-
  Agillion, Inc. was an Austin, Texas web-based customer relationship management
  (CRM) company founded in 1998 by Steve Papermaster. It offered small and
  mid-sized businesses a hosted, continuously updated online database that
  consolidated customer information as businesses and their customers interacted,
  an early software-as-a-service CRM offering. The company raised roughly $40M
  from investors including Cisco, Goldman Sachs, and Morgan Stanley and is
  carried as a portfolio company of Insight Partners. Agillion has since been
  permanently closed; its agillion.com domain no longer serves a website and the
  company exposes no public developer portal, documentation, or API surface. This
  profile is retained in the API Evangelist network as a historical record.
